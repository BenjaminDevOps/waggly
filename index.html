<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Waggly - Your Pet's Health Companion</title>
    <style>
      /* Native splash screen — shown before JS loads */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FAF8F5;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo-ring {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: linear-gradient(135deg, #5B5EA6, #7B7FCC);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 40px rgba(91, 94, 166, 0.3);
        animation: splash-pulse 2s ease-in-out infinite;
      }
      #splash .paw-icon {
        animation: splash-spin 1.8s ease-in-out infinite;
      }
      #splash .app-name {
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #2D2D3A;
        letter-spacing: -0.02em;
      }
      #splash .app-tagline {
        margin-top: 6px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
        font-size: 15px;
        color: #9D9DAF;
      }
      #splash .loader-bar {
        margin-top: 32px;
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: #E8E4DF;
        overflow: hidden;
      }
      #splash .loader-bar-fill {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #5B5EA6, #7B7FCC);
        animation: splash-loading 1.4s ease-in-out infinite;
      }
      @keyframes splash-spin {
        0%   { transform: rotate(0deg); }
        25%  { transform: rotate(15deg); }
        50%  { transform: rotate(0deg); }
        75%  { transform: rotate(-15deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.04); }
      }
      @keyframes splash-loading {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <!-- Native splash screen -->
    <div id="splash">
      <div class="logo-ring">
        <svg class="paw-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="4" r="2"/>
          <circle cx="18" cy="8" r="2"/>
          <circle cx="4" cy="8" r="2"/>
          <path d="M9 10a5 5 0 0 1 5 0"/>
          <path d="M16.5 13.5a4 4 0 0 1-2.3 3.7l-1.3.7a2 2 0 0 1-1.8 0l-1.3-.7a4 4 0 0 1-2.3-3.7c0-1.3.8-2.5 2-3l1.3-.7a2 2 0 0 1 1.8 0l1.3.7c1.2.5 2 1.7 2 3Z"/>
        </svg>
      </div>
      <div class="app-name">Waggly</div>
      <div class="app-tagline">Your Pet's Health Companion</div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
